<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <title>Escorpión: cazador del desierto</title>
    <meta name="description" content="Juego de un escorpión procedural: caza insectos y pica a los lagartos.">
    <meta name="theme-color" content="#3d2a7a">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #1a120a;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #escorpion {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: "Barlow", Arial, sans-serif;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <canvas id="escorpion" data-modo="juego" aria-label="Juego del escorpión"></canvas>
    <script src="escorpion.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
      }
    </script>
  </body>
</html>
